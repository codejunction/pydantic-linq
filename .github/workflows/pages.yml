name: pages

on:
  push:
    branches: [main]
    paths: [docs/**, src/**, examples/**, CHANGELOG.md, mkdocs.yml, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      # the API reference is generated from the docstrings in src/, so the site rebuilds on code changes too
      - run: uv run --locked --group docs mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
