[project]
name = "pydantic-linq"
version = "0.1.1"
description = "C# LINQ (Enumerable + AsyncEnumerable) for Python, typed and Pydantic-aware"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Abhishek Dutta", email = "phoenixdutta@gmail.com" }]
keywords = ["linq", "pydantic", "query", "iterator", "async", "functional", "collections"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Framework :: Pydantic :: 2",
  "Typing :: Typed",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["pydantic>=2.7"]

[project.urls]
Homepage = "https://github.com/codejunction/pydantic-linq"
Source = "https://github.com/codejunction/pydantic-linq"
Issues = "https://github.com/codejunction/pydantic-linq/issues"

[project.optional-dependencies]
sqlmodel = [
    "sqlalchemy[asyncio]>=2.0",
    "sqlmodel>=0.0.22",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "pytest>=8",
    "sqlalchemy[asyncio]>=2.0",
    "sqlmodel>=0.0.22",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
pythonpath = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"
